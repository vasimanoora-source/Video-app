<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Video Generator</title>
<style>
:root{--bg:#f3efe6;--fg:#1d2433;--mut:#5d6677;--card:#fff;--line:#d9d3c4;--acc:#2f5bea;--ok:#1f8a4c;--bad:#c23a3a}
@media (prefers-color-scheme:dark){:root{--bg:#14171f;--fg:#eef0f6;--mut:#99a1b3;--card:#1d212c;--line:#2e3445;--acc:#7d9bff;--ok:#5fd18b;--bad:#ff7b7b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:24px 16px 56px}
h1{font-size:1.7rem;margin:0 0 4px}p.sub{margin:0 0 16px;color:var(--mut)}
label{display:block;margin-top:12px;font-weight:600;font-size:.85rem}
textarea,select,input[type=file]{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:inherit}
textarea{min-height:200px;resize:vertical}
button{padding:12px 16px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:inherit;font-weight:700;cursor:pointer}
button.big{width:100%;margin-top:14px;padding:14px;font-size:1rem}
button.alt{background:var(--card);color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.5}
#info,#msg{color:var(--mut);font-size:.9rem;margin:8px 0}
.clip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px}
.clip b{font-size:.95rem}.st{font-size:.85rem;margin-left:6px}
.done{color:var(--ok)}.error{color:var(--bad)}
.clip small{display:block;color:var(--mut);margin-top:4px;word-break:break-word}
video{width:100%;border-radius:10px;background:#000;margin-top:8px}
a{color:var(--acc);font-weight:600}
</style>
</head>
<body>
<main>
<h1>AI Video Generator</h1>
<p class="sub">Neraiya prompts podunga, ovvoru clip-um generate aagi, ellam ore video-va join aagum.</p>
<label for="file">Prompts file (.md) upload pannunga, illa keezha paste pannunga</label>
<input type="file" id="file" accept=".md,.txt">
<label for="p">Prompts (ovvoru prompt-um ``` block-la, illa --- vachi piringa)</label>
<textarea id="p"></textarea>
<p id="info"></p>
<label for="ar">Aspect ratio</label>
<select id="ar"><option value="16:9">16:9 (landscape)</option><option value="9:16">9:16 (vertical)</option></select>
<button class="big" id="go">Generate all clips</button>
<p id="msg"></p>
<div id="final"></div>
<div id="clips"></div>
</main>
<script>
const $=id=>document.getElementById(id);
function parse(t){
  const blocks=[...t.matchAll(/```[^\n]*\n([\s\S]*?)```/g)].map(m=>m[1].trim()).filter(Boolean);
  if(blocks.length)return blocks;
  return t.split(/\n-{3,}\n/).map(s=>s.trim()).filter(Boolean);
}
function upd(){const n=parse($('p').value).length;$('info').textContent=n?n+' clip(s) kedaichuchu.':''}
$('p').oninput=upd;
$('file').onchange=async e=>{const f=e.target.files[0];if(f){$('p').value=await f.text();upd()}};
let id=null,timer=null;
$('go').onclick=async()=>{
  const prompts=parse($('p').value);
  if(!prompts.length){$('msg').textContent='Prompts paste pannunga.';return}
  $('go').disabled=true;$('final').innerHTML='';
  const r=await fetch('/api/batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompts,aspectRatio:$('ar').value})});
  const d=await r.json();
  if(!r.ok){$('msg').textContent='Error: '+d.error;$('go').disabled=false;return}
  id=d.id;$('msg').textContent='Generate aagudhu. Page-a close pannaadheenga (clip-ku 1-3 min).';
  clearInterval(timer);timer=setInterval(poll,5000);poll();
};
async function poll(){
  const r=await fetch('/api/job?id='+id);const d=await r.json();
  if(!r.ok){$('msg').textContent=d.error;clearInterval(timer);return}
  const box=$('clips');
  d.clips.forEach((c,i)=>{
    let el=document.getElementById('c'+i);
    if(!el){el=document.createElement('div');el.className='clip';el.id='c'+i;
      el.innerHTML='<b>Clip '+(i+1)+'</b><span class="st"></span><small></small><div class="act"></div>';box.appendChild(el)}
    const st=el.querySelector('.st');st.textContent=({queued:'waiting',running:'generating…',done:'done',error:'error'})[c.status];st.className='st '+c.status;
    el.querySelector('small').textContent=c.error||'';
    const act=el.querySelector('.act');
    if(c.status==='done'&&!act.firstChild){act.innerHTML='<video controls playsinline preload="metadata"></video>';act.firstChild.src=c.file}
    if(c.status==='error'&&!act.querySelector('button')){act.innerHTML='<button class="alt">Retry</button>';act.firstChild.onclick=async()=>{await fetch('/api/retry',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,i})});act.innerHTML=''}}
    if(c.status!=='error'&&act.querySelector('button'))act.innerHTML='';
  });
  const done=d.clips.filter(c=>c.status==='done').length,busy=d.clips.some(c=>c.status==='queued'||c.status==='running');
  $('msg').textContent=done+' / '+d.clips.length+' clips ready'+(busy?'…':'.');
  const f=$('final');
  if(!busy&&done&&!f.querySelector('#join')&&!d.final){f.innerHTML='<button class="big" id="join">Join '+done+' clips into one video</button>';
    $('join').onclick=async()=>{$('join').disabled=true;$('join').textContent='Joining…';
      const j=await fetch('/api/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});const jd=await j.json();
      if(!j.ok){$('msg').textContent='Error: '+jd.error;$('join').disabled=false;$('join').textContent='Join again';return}poll()}}
  if(d.final&&!f.querySelector('video')){f.innerHTML='<h2>Final video</h2><video controls playsinline></video><p><a download="story.mp4">Download final video</a></p>';f.querySelector('video').src=d.final;f.querySelector('a').href=d.final}
  if(!busy){$('go').disabled=false;if(d.final||!done)clearInterval(timer)}
}
</script>
</body>
</html>
